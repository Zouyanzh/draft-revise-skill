name: Build release package

on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Create package
        run: python tools/build_release.py
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag --draft
          --title "draft-revise $GITHUB_REF_NAME — Codex skill"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          dist/*.zip dist/*.tar.gz dist/SHA256SUMS
